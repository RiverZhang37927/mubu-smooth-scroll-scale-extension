<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>幕布设置</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #fff; color: #222; }
  .wrap { padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { font-size: 12px; opacity: .6; margin-bottom: 12px; }
  .card { border: 1px solid rgba(0,0,0,.12); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #fafafa; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  input, select, button { font: inherit; border: 1px solid rgba(0,0,0,.2); border-radius: 6px; padding: 6px 8px; background: #fff; color: inherit; }
  input, select { flex: 1; min-width: 0; }
  select[size] { height: 170px; }
  button { cursor: pointer; white-space: nowrap; }
  button.primary { background: #d33a2c; color: #fff; border-color: #d33a2c; }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid rgba(0,0,0,.18); border-radius: 999px; padding: 3px 10px; background: transparent; cursor: pointer; font-size: 12px; }
  .chip:hover { background: rgba(211,58,44,.10); border-color: #d33a2c; }
  .status { font-size: 12px; min-height: 18px; margin-top: 6px; opacity: .8; word-break: break-all; }
  .hint { font-size: 11px; opacity: .55; margin-top: 6px; }
  .none-tip { font-size: 12px; opacity: .6; }
  @media (prefers-color-scheme: dark) {
    body { background: #1f1f22; color: #e9e9e9; }
    .card { background: #2a2a2e; border-color: #3a3a40; }
    input, select, button { background: #33333a; color: #eee; border-color: #45454d; }
    button.primary { background: #d33a2c; border-color: #d33a2c; }
    .chip { border-color: #4a4a52; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>幕布设置</h1>
  <div class="sub">字体 / 平滑滚动 / 平滑缩放</div>

  <div class="card">
    <div class="row">
      <input id="search" type="search" placeholder="搜索已安装字体（如 宋体、思源、Noto）">
    </div>
    <div class="row">
      <select id="fontList" size="8"></select>
    </div>
    <div class="row">
      <input id="custom" type="text" placeholder="字体名称（留空=不修改字体）">
    </div>
    <div class="row">
      <button id="apply" class="primary">保存并应用</button>
      <button id="reload">刷新页面</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <div class="sub" style="margin:0 0 6px">常用字体</div>
    <div id="chips" class="chips"></div>
  </div>

  <div class="hint">提示：思维导图（画布）文字在刷新页面后完全生效。</div>
</div>
<script src="popup.js"></script>
</body>
</html>
